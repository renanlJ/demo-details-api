server:
  port: ${PORT:8081}

spring:
  application:
    name: demo-details-api

app:
  fail-readiness: ${FAIL_READINESS:false}

management:
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: health
      path-mapping:
        health: healthz
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    root: ${LOG_LEVEL:INFO}
