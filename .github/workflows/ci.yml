name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: demo-details-api

jobs:
  quality:
    name: Lint, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format check (spotless)
        run: mvn -B spotless:check
      - name: Unit tests with coverage
        run: mvn -B verify
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  security:
    name: SAST, SCA and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: SCA (OWASP dependency-check)
        run: mvn -B org.owasp:dependency-check-maven:12.1.0:check -DfailBuildOnCVSS=7
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: Filesystem scan (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: target/dependency-check-report.html

  build:
    name: Build jar
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B package -DskipTests
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  image:
    name: Container image build and scan
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
      - name: Upload image scan report
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-reports
          path: trivy-image.sarif
      - name: Publish to GHCR (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE_NAME:ci" "$REPO:${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE_NAME:ci" "$REPO:latest"
          docker push "$REPO:${GITHUB_REF_NAME#v}"
          docker push "$REPO:latest"
